# Build prototypey.org (packages/site) and deploy it to Cloudflare Pages
# (project "prototypey") on every push to main. A failed build never deploys.
jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - run: npx -y wrangler@4 pages deploy packages/site/dist --project-name prototypey --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
