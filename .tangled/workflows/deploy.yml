# Build prototypey.org and deploy it to Cloudflare Pages on every push to main.
# A failed build stops before the deploy step, so the live site is left alone.
#
# Repo secret (Settings -> Secrets):
#   CLOUDFLARE_API_TOKEN — Cloudflare API token with Account > Cloudflare Pages: Edit

when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nodejs_24
    - wrangler

environment:
  CLOUDFLARE_ACCOUNT_ID: "84ad38769d90c68fd474b220f2ec59c5"

steps:
  - name: "build"
    command: |
      set -e
      corepack pnpm install --frozen-lockfile
      corepack pnpm build
  - name: "deploy"
    command: |
      set -e
      wrangler pages deploy packages/site/dist --project-name prototypey --branch main
